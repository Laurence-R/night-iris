# Val: Night-Iris LDR + the detect weights from detect_bdd_night_iris_train.toml.
# That best.pt appears only after the train config runs, and runs/ is not in git.

name = "bdd10k-night-iris-finetuned"
mode = "val"
model = "runs/bdd10k-night-iris-baseline/weights/best.pt"
data = "datasets/bdd10k-night-iris/70-15-15/data.yaml"
device = 0

[train]
epochs = 50
patience = 15
batch = 8
imgsz = 640

[val]
batch = 1
imgsz = 640

[predict]
source = "datasets/bdd10k-night-iris/70-15-15/valid/images"
conf = 0.25

[export]
format = "engine"
quantize = 16
batch = 1
