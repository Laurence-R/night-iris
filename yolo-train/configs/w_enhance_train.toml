# Train on w_enhance starting from pretrained weights

name = "w_enhance_train"
mode = "train"
model = "pretrained_model/yolo26n.pt"
model_template = "pretrained_model/yolo26{size}.pt"
data = "w_enhance/data.yaml"
device = 0

[train]
epochs = 50
patience = 15
batch = 8
imgsz = 640

[val]
batch = 1
imgsz = 640

[predict]
source = "dark_rgb"
conf = 0.25

[export]
format = "engine"
quantize = 16
batch = 1
