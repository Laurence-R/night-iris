[project]
name = "yolo-lab"
version = "0.1.0"
description = "YOLO experiment lab: train, validate, and export TensorRT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-modelopt[onnx]>=0.44",
    "onnx>=1.12.0,<2.0.0",
    "onnxruntime-gpu>=1.22.0",
    "onnxslim>=0.1.82",
    "tensorrt-cu12>=11.2.1.2",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.4.66",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
