# Val: w_enhance data + fine-tuned weights

name = "w_enhance_finetune"
mode = "val"
model = "fine_tuned_model/yolo26n_trained.pt"
model_template = "fine_tuned_model/yolo26{size}_trained.pt"
data = "w_enhance/data.yaml"
device = 0

[train]
epochs = 50
patience = 15
batch = 8
imgsz = 640

[val]
batch = 1
imgsz = 640

[predict]
source = "dark_rgb"
conf = 0.25

[export]
format = "engine"
quantize = 16
batch = 1
